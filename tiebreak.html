<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <script src="auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вирішальний раунд</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <a href="tournament.html" class="back-link">← Сітка</a>

    <header class="top">
      <h1>⚡ Вирішальний раунд — Асоціації</h1>
      <p id="subHeading"></p>
    </header>

    <div class="match-scoreboard">
      <div class="team-score-box">
        <div class="name" id="teamAName">—</div>
        <div class="val" id="teamAScore">0</div>
      </div>
      <div class="team-score-box">
        <div class="name" id="teamBName">—</div>
        <div class="val" id="teamBScore">0</div>
      </div>
    </div>

    <!-- Етап 1: слова по черзі -->
    <div class="tiebreak-question-box" id="showPhase">
      <div class="pts" id="wordCounter"></div>
      <div class="assoc-word" id="wordText"></div>
      <div class="assoc-timer" id="timerText"></div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-primary" id="startBtn">▶ Почати</button>
        <button class="btn btn-ghost" id="pauseBtn" style="display:none;">⏸ Пауза</button>
        <button class="btn btn-primary" id="toCheckBtn" style="display:none;">📝 До перевірки</button>
      </div>
    </div>

    <!-- Етап 2: вписуємо відповіді з листків і перевіряємо -->
    <div id="checkPhase" style="display:none;">
      <p class="assoc-rules">
        Впишіть відповіді з листків. Порожньо — <b>−1</b> · ✗ помилкова — <b>0</b> ·
        правильна — <b>2</b> · правильна, але «=» співпадає з суперниками — <b>1</b>
      </p>
      <table class="assoc-table">
        <thead>
          <tr>
            <th>№</th>
            <th>Слово</th>
            <th id="thA"></th>
            <th title="Відповіді співпадають">=</th>
            <th id="thB"></th>
          </tr>
        </thead>
        <tbody id="assocBody"></tbody>
      </table>
      <div class="modal-actions" style="justify-content:flex-start; margin-top:12px;">
        <button class="btn btn-ghost" id="backToShowBtn">↺ Показати слова ще раз</button>
      </div>

      <div class="finish-panel" id="resultPanel">
        <h3 id="resultText"></h3>
        <div class="buttons" id="resultButtons"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="tournament-core.js"></script>
  <script src="tiebreak-data.js"></script>
  <script src="tiebreak.js"></script>
</body>
</html>
