<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квіз-турнір</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>🏆 Квіз-турнір</h1>
    </header>

    <div id="continueBanner" class="continue-banner" style="display:none;">
      <div>Турнір уже триває</div>
      <button class="btn btn-primary" id="continueBtn">Продовжити →</button>
    </div>

    <div class="setup-card">
      <div class="team-inputs" id="teamInputs"></div>
      <div class="form-actions">
        <button class="btn btn-primary" id="startBtn">🚀 Новий турнір</button>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="tournament-core.js"></script>
  <script>
    const teamInputsEl = document.getElementById("teamInputs");
    const defaults = defaultState().teams;

    defaults.forEach((name, i) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = `<input type="text" id="teamName${i}" value="${name}" maxlength="40" />`;
      teamInputsEl.appendChild(wrap);
    });

    if (tournamentExists()) {
      document.getElementById("continueBanner").style.display = "flex";
    }

    document.getElementById("continueBtn").addEventListener("click", () => {
      window.location.href = "tournament.html";
    });

    document.getElementById("startBtn").addEventListener("click", () => {
      if (tournamentExists()) {
        const ok = confirm(
          "Поточний турнір буде втрачено. Почати новий?"
        );
        if (!ok) return;
      }
      const state = defaultState();
      for (let i = 0; i < 8; i++) {
        const val = document.getElementById("teamName" + i).value.trim();
        if (val) state.teams[i] = val;
      }
      saveTournament(state);
      window.location.href = "tournament.html";
    });
  </script>
</body>
</html>
