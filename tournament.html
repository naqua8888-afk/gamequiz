<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Турнірна сітка</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back-link">← Команди</a>

    <section class="cat-board-section">
      <div class="cat-board" id="catBoard"></div>
    </section>

    <div class="bracket">
      <div class="bracket-col">
        <h3>Раунд 1</h3>
        <div id="r1Col"></div>
      </div>
      <div class="bracket-col">
        <h3>Раунд 2</h3>
        <div id="r2Col"></div>
      </div>
      <div class="bracket-col">
        <h3>Фінал команд</h3>
        <div id="r3Col"></div>
      </div>
    </div>

    <div class="final-section" id="finalSection"></div>
    <div class="tiebreak-section" id="tiebreakSection"></div>

    <footer class="note">
      <button class="reset-btn" id="resetTournamentBtn">Скинути турнір</button>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="tournament-core.js"></script>
  <script src="tournament.js"></script>
</body>
</html>
